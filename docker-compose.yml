services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["8000:8000"]
    volumes:
      - ./weights:/app/weights
      - ./workflows:/app/workflows
      - ./workspace:/app/workspace
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["${VIS_FRONTEND_PORT:-5173}:80"]
    depends_on: [backend]
    restart: unless-stopped
