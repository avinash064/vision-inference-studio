families:
  yolo:
    display_name: YOLO
    adapter: yolo
    result_type: detections
    # Native Ultralytics checkpoints plus compatible exported v7 models.
    extensions: [.pt, .onnx, .engine]
    versions:
      v3:
        sizes: [base, tiny, spp, custom]
      v5:
        sizes: [n, s, m, l, x, custom]
      v6:
        sizes: [n, s, m, l, l6, custom]
      v7-export:
        sizes: [tiny, base, x, custom]
      v8:
        sizes: [n, s, m, l, x, custom]
      v9:
        sizes: [t, s, m, c, e, custom]
      v10:
        sizes: [n, s, m, b, l, x, custom]
      v11:
        sizes: [n, s, m, l, x, custom]
      v12:
        sizes: [n, s, m, l, x, custom]
      v26:
        sizes: [n, s, m, l, x, custom]

  yolo-seg:
    display_name: YOLO Segmentation
    adapter: yolo-seg
    result_type: segmentation
    # Ultralytics segmentation checkpoints, including custom *-seg.pt exports.
    extensions: [.pt, .onnx, .engine]
    versions:
      v5:
        sizes: [n, s, m, l, x, custom]
      v8:
        sizes: [n, s, m, l, x, custom]
      v9:
        sizes: [c, e, custom]
      v11:
        sizes: [n, s, m, l, x, custom]
      v12:
        sizes: [n, s, m, l, x, custom]
      v26:
        sizes: [n, s, m, l, x, custom]

  rtdetr:
    # Ultralytics RT-DETR-L / RT-DETR-X and compatible custom .pt checkpoints.
    display_name: RT-DETR
    adapter: rtdetr
    result_type: detections
    extensions: [.pt]
    versions:
      ultralytics:
        sizes: [l, x, custom]

  rtdetrv2:
    # Native checkpoint from the official lyuwenyu/RT-DETR PyTorch runtime.
    # This is deliberately separate from Ultralytics RT-DETR: their checkpoint
    # containers and model construction paths are not interchangeable.
    display_name: RT-DETRv2 (Official PyTorch)
    adapter: rtdetrv2
    result_type: detections
    extensions: [.pth]
    versions:
      bmd-45:
        sizes: [r101-x]

  rfdetr:
    display_name: RF-DETR
    adapter: rfdetr
    result_type: detections
    extensions: [.pth, .pt]
    # Patch size changes the backbone architecture, not merely preprocessing.
    # Large supports both generations; the other sizes have one valid layout.
    patch_sizes:
      base: [14]
      nano: [16]
      small: [16]
      medium: [16]
      large: [14, 16]
    versions:
      v1:
        sizes: [base, nano, small, medium, large]

  dinov3:
    display_name: DINOv3
    adapter: dinov3
    result_type: feature_map
    extensions: [.pth, .pt]
    versions:
      official:
        sizes: [vit-s, vit-b, vit-l]

  grounding-dino:
    # Official IDEA-Research implementation: tiny = groundingdino_swint_ogc.pth, base = groundingdino_swinb_cogcoor.pth
    display_name: Grounding DINO
    adapter: grounding-dino
    result_type: detections
    extensions: [.pth]
    prompt_modes: [text]
    controls: [text_threshold]
    versions:
      official:
        sizes: [tiny, base]

  sam:
    display_name: Segment Anything (SAM)
    adapter: sam
    result_type: segmentation
    extensions: [.safetensors, .bin, .pth, .pt]
    prompt_modes: [point, box]
    controls: [mask_threshold, multimask]
    versions:
      v1:
        sizes: [vit-b, vit-l, vit-h]

  sam2:
    # Meta SAM 2 / 2.1 checkpoints (sam2.1_hiera_*.pt) or the Ultralytics mirrors (sam2.1_b.pt …), run by Ultralytics
    display_name: Segment Anything 2 (SAM 2)
    adapter: sam2
    result_type: segmentation
    extensions: [.pt]
    prompt_modes: [point, box]
    versions:
      "2.1":
        sizes: [tiny, small, base-plus, large]
      "2.0":
        sizes: [tiny, small, base-plus, large]

  sam3:
    # sam3.pt from the gated facebook/sam3 Hugging Face repo, run by Ultralytics
    display_name: Segment Anything 3 (SAM 3)
    adapter: sam3
    result_type: segmentation
    extensions: [.pt]
    prompt_modes: [text, point, box]
    versions:
      "3.0":
        sizes: [base]

  paddleocr:
    display_name: PaddleOCR
    adapter: paddleocr
    result_type: ocr
    extensions: []
    requires_weights: false
    runtime_fields: [ocr_language]
    versions:
      PP-OCRv5:
        sizes: [server, mobile]

  tesseract:
    display_name: Tesseract OCR
    adapter: tesseract
    result_type: ocr
    extensions: []
    requires_weights: false
    runtime_fields: [ocr_language]
    versions:
      "5":
        sizes: [system]

  vllm:
    display_name: vLLM Vision / OCR
    adapter: vllm
    result_type: ocr
    extensions: []
    requires_weights: false
    prompt_modes: [text]
    runtime_fields: [ocr_language, endpoint_url, endpoint_model]
    versions:
      openai-compatible:
        sizes: [remote]

  onnx:
    display_name: Generic ONNX
    adapter: onnx
    result_type: tensor
    extensions: [.onnx]
    versions:
      generic:
        sizes: [custom]

feature_extractors:
  dinov3:
    display_name: DINOv3
    family: dinov3
    version: official
    variant: vit-b
    stages: [last_hidden_state]
  rfdetr-v2.2:
    display_name: RF-DETR v2.2 Backbone
    family: rfdetr
    version: v2.2
    variant: RFDETRLargeDeprecated
    stages: [fine_80, coarse_20]
  rfdetr-arch-b:
    display_name: RF-DETR Architecture B
    family: rfdetr
    version: architecture-b
    variant: seglarge
    stages: [backbone_42]
